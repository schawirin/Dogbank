# =============================================================================
# DogBank - Investment Service Deployment
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: investment-service
  namespace: dogbank
  labels:
    app: investment-service
    tags.datadoghq.com/env: dogbank
    tags.datadoghq.com/service: investment-service
    tags.datadoghq.com/version: "1.0.0"
    tags.datadoghq.com/team: dogbank-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: investment-service
  template:
    metadata:
      labels:
        app: investment-service
        tags.datadoghq.com/env: dogbank
        tags.datadoghq.com/service: investment-service
        tags.datadoghq.com/version: "1.0.0"
        tags.datadoghq.com/team: dogbank-backend
      annotations:
        admission.datadoghq.com/java-lib.version: "latest"
        admission.datadoghq.com/js-lib.config.v1: '{"disabled":true}'
        admission.datadoghq.com/python-lib.config.v1: '{"disabled":true}'
        admission.datadoghq.com/dotnet-lib.config.v1: '{"disabled":true}'
        admission.datadoghq.com/ruby-lib.config.v1: '{"disabled":true}'
        admission.datadoghq.com/php-lib.config.v1: '{"disabled":true}'
        ad.datadoghq.com/investment-service.logs: '[{"type":"json","source":"java","service":"investment-service"}]'
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: investment-service
      containers:
        - name: investment-service
          image: schawirin/dogbank-investment-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8091
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: dogbank-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SPRING_APPLICATION_NAME
              value: "investment-service"
            - name: SERVER_PORT
              value: "8091"
            - name: INVESTMENT_CDI_ANNUAL_RATE
              valueFrom:
                configMapKeyRef:
                  name: dogbank-config
                  key: INVESTMENT_CDI_ANNUAL_RATE
            - name: INVESTMENT_CDI_DAILY_RATE
              valueFrom:
                configMapKeyRef:
                  name: dogbank-config
                  key: INVESTMENT_CDI_DAILY_RATE
            - name: INVESTMENT_BTC_PRICE_BRL
              valueFrom:
                configMapKeyRef:
                  name: dogbank-config
                  key: INVESTMENT_BTC_PRICE_BRL
            - name: INVESTMENT_DRIFT_THRESHOLD_PERCENT
              valueFrom:
                configMapKeyRef:
                  name: dogbank-config
                  key: INVESTMENT_DRIFT_THRESHOLD_PERCENT
            - name: DOGBANK_LOG_DIR
              valueFrom:
                configMapKeyRef:
                  name: dogbank-config
                  key: DOGBANK_LOG_DIR
            - name: DD_ENV
              valueFrom:
                configMapKeyRef:
                  name: dogbank-config
                  key: DD_ENV
            - name: DD_SERVICE
              value: "investment-service"
            - name: DD_VERSION
              valueFrom:
                configMapKeyRef:
                  name: dogbank-config
                  key: DD_VERSION
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_TRACE_AGENT_PORT
              valueFrom:
                configMapKeyRef:
                  name: dogbank-config
                  key: DD_TRACE_AGENT_PORT
            - name: DD_LOGS_INJECTION
              valueFrom:
                configMapKeyRef:
                  name: dogbank-config
                  key: DD_LOGS_INJECTION
            - name: DD_PROFILING_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: dogbank-config
                  key: DD_PROFILING_ENABLED
            - name: DD_APPSEC_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: dogbank-config
                  key: DD_APPSEC_ENABLED
            - name: DD_IAST_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: dogbank-config
                  key: DD_IAST_ENABLED
            - name: DD_RUNTIME_METRICS_ENABLED
              value: "true"
            - name: DD_TRACE_SAMPLE_RATE
              value: "1"
            - name: DD_TRACE_PROPAGATION_STYLE_EXTRACT
              value: "tracecontext,datadog,baggage"
            - name: DD_TRACE_PROPAGATION_STYLE_INJECT
              value: "tracecontext,datadog,baggage"
            - name: DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED
              value: "true"
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "768Mi"
              cpu: "750m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8091
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8091
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: investment-service
  namespace: dogbank
  labels:
    app: investment-service
spec:
  type: ClusterIP
  ports:
    - port: 8091
      targetPort: 8091
      name: http
  selector:
    app: investment-service
