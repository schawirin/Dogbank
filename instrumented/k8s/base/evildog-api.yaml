# =============================================================================
# EvilDog API — Attack Orchestrator backend (DogBank LAB ONLY)
# -----------------------------------------------------------------------------
# Python FastAPI service that wraps the SecurityAttacker engine behind REST + SSE
# so the in-app EvilDog tab can drive REAL, lab-scoped attacks and stream live
# telemetry. Reached by the frontend via the ingress at /api/evildog/*.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evildog-api
  namespace: dogbank
  labels:
    app: evildog-api
    tags.datadoghq.com/env: dogbank
    tags.datadoghq.com/service: evildog-api
    tags.datadoghq.com/version: "1.0.0"
    tags.datadoghq.com/team: security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evildog-api
  template:
    metadata:
      labels:
        app: evildog-api
        tags.datadoghq.com/env: dogbank
        tags.datadoghq.com/service: evildog-api
        tags.datadoghq.com/version: "1.0.0"
      annotations:
        # Datadog APM - Python auto-instrumentation
        admission.datadoghq.com/python-lib.version: "latest"
        admission.datadoghq.com/java-lib.config.v1: '{"disabled":true}'
        admission.datadoghq.com/js-lib.config.v1: '{"disabled":true}'
        admission.datadoghq.com/dotnet-lib.config.v1: '{"disabled":true}'
        admission.datadoghq.com/ruby-lib.config.v1: '{"disabled":true}'
        admission.datadoghq.com/php-lib.config.v1: '{"disabled":true}'
        ad.datadoghq.com/evildog-api.logs: '[{"source": "python", "service": "evildog-api"}]'
    spec:
      serviceAccountName: evildog-api
      containers:
        - name: evildog-api
          image: schawirin/dogbank-evildog-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8092
              name: http
          env:
            # Lab-scoped targets (internal service names — never external hosts).
            # To flag the attacker source IP in Datadog AAP instead, set
            # EXTERNAL_TARGET=true and PUBLIC_BASE_URL=https://lab.dogbank.dog.
            - name: EXTERNAL_TARGET
              value: "false"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8088"
            - name: TRANSACTION_SERVICE_URL
              value: "http://transaction-service:8084"
            - name: ACCOUNT_SERVICE_URL
              value: "http://account-service:8089"
            - name: CHATBOT_SERVICE_URL
              value: "http://chatbot-service:8083"
            - name: NGINX_URL
              value: "http://nginx:80"
            - name: EVILDOG_TARGET_LABEL
              value: "lab.dogbank.dog"
            # Log4Shell exfil callback (evildog-callback service)
            - name: LOG4J_CALLBACK_HOST
              value: "evildog-callback"
            - name: LOG4J_CALLBACK_LDAP_PORT
              value: "1389"
            - name: LOG4J_CALLBACK_HTTP_PORT
              value: "8000"
            - name: LOG4J_EXFIL_ENV
              value: "SPRING_DATASOURCE_PASSWORD"
            # Control token for the EvilDog operator session. This is separate
            # from the auth-service remediation credential and never reaches
            # the frontend bundle.
            - name: EVILDOG_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dogbank-secrets
                  key: EVILDOG_CONTROL_TOKEN
            # Bearer token the ephemeral agent Jobs use to POST telemetry back here.
            - name: EVILDOG_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dogbank-secrets
                  key: EVILDOG_AGENT_TOKEN
            - name: DOGBANK_ADMIN_BLOCK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dogbank-secrets
                  key: ADMIN_BLOCK_TOKEN
            # Datadog APM
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_TRACE_AGENT_PORT
              value: "8126"
            - name: DD_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/env']
            - name: DD_SERVICE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/service']
            - name: DD_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/version']
            - name: DD_LOGS_INJECTION
              value: "true"
            # IP de origem que a AAP enxerga (o RECON informa "bloqueie ESTE IP")
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              memory: "192Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "700m"
          livenessProbe:
            httpGet:
              path: /api/evildog/health
              port: 8092
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/evildog/health
              port: 8092
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: evildog-api
  namespace: dogbank
  labels:
    app: evildog-api
spec:
  type: ClusterIP
  ports:
    - port: 8092
      targetPort: 8092
      protocol: TCP
      name: http
  selector:
    app: evildog-api
