# Somente as rotas /security-lab usam esta política variável. O restante do
# DogBank continua protegido por X-Frame-Options SAMEORIGIN.
map $arg_mode $security_lab_frame_policy {
    default "frame-ancestors 'self'";
    vulnerable "frame-ancestors *";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # SPA routing - todas as rotas retornam index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SECURITY LAB ONLY: em vulnerable mode o header permite framing para
    # demonstrar postMessage("*"). Em fixed/default mode, CSP bloqueia pais de
    # outra origem. Declarar add_header aqui também evita herdar X-Frame-Options
    # SAMEORIGIN apenas nesta rota didática.
    location = /security-lab/pix-demo {
        add_header Content-Security-Policy $security_lab_frame_policy always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location = /security-lab/trusted-receiver {
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
