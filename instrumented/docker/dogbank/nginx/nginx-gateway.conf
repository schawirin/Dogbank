# =============================================================================
# Nginx Gateway Configuration - DogBank
# =============================================================================
# Este arquivo configura o Nginx como proxy reverso para:
# - Frontend (React)
# - APIs do Backend (Auth, Account, Transaction, BancoCentral)
#
# As rotas (location blocks) ficam em locations.conf, compartilhado pelos
# dois server blocks (HTTP :80 e HTTPS :443 local via mkcert) -- evita
# duplicar ~380 linhas idênticas entre os dois.
# =============================================================================

upstream frontend {
    server frontend:80;
}

upstream auth-api {
    server auth-service:8088;
}

upstream account-api {
    server account-service:8089;
}

upstream transaction-api {
    server transaction-service:8084;
}

upstream bancocentral-api {
    server bancocentral-service:8085;
}

upstream investment-api {
    server investment-service:8091;
}

upstream chatbot-api {
    server chatbot-service:8083;
}

upstream evildog-api {
    server evildog-api:8092;
}

server {
    listen 80;
    server_name localhost lab.dogbank.dog;

    include /etc/nginx/locations.conf;
}

# HTTPS local via mkcert (certificado confiável só nesta máquina) -- ver
# nginx/certs/, gerado por fora do repo, montado read-only no container.
server {
    listen 443 ssl;
    server_name lab.dogbank.dog;

    ssl_certificate /etc/nginx/certs/lab.dogbank.dog.pem;
    ssl_certificate_key /etc/nginx/certs/lab.dogbank.dog-key.pem;

    include /etc/nginx/locations.conf;
}
