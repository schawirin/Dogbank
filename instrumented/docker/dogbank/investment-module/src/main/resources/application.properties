server.port=8091

spring.application.name=investment-module
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/dogbank}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dogbank}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dog1234}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

investment.cdi.annual-rate=${INVESTMENT_CDI_ANNUAL_RATE:0.1065}
investment.cdi.daily-rate=${INVESTMENT_CDI_DAILY_RATE:0.00042262}
investment.btc.price-brl=${INVESTMENT_BTC_PRICE_BRL:342500.00}
investment.drift.threshold-percent=${INVESTMENT_DRIFT_THRESHOLD_PERCENT:0.50}
investment.registry.base-url=${INVESTMENT_REGISTRY_URL:http://investment-registry-mock:8092}

logging.level.root=INFO
logging.level.com.dogbank=INFO
logging.config=classpath:log4j2.xml
spring.main.banner-mode=off
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
